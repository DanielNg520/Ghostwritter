<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div id="header-bar">
    <img class="app-icon" src="icons/icon32.png" alt="">
    <h1>Ghost Writer</h1>
    <button id="settings-btn" title="Settings">⚙</button>
  </div>

  <div id="mode-toggle">
    <button id="mode-review-btn" class="mode-btn active" type="button">Product Review</button>
    <button id="mode-general-btn" class="mode-btn" type="button">General Writer</button>
  </div>

  <div id="provider-row">
    <label for="provider-select">Generate with</label>
    <select id="provider-select">
      <option value="agy">Agy (local CLI)</option>
      <option value="claude_code">Claude Code (local CLI)</option>
      <option value="openrouter">OpenRouter</option>
      <option value="groq">Groq</option>
      <option value="local">Local model</option>
    </select>
  </div>

  <div id="review-section">
    <label for="comment">Notes</label>
    <textarea id="comment" placeholder="Notes about this product (optional)..."></textarea>
  </div>

  <div id="general-section" hidden>
    <label for="category-select">Category</label>
    <select id="category-select">
      <option value="" disabled selected>Loading categories&hellip;</option>
    </select>
    <label for="employer-input">Employer</label>
    <input type="text" id="employer-input" placeholder="Employer name (auto-detected, editable)">
    <label for="prompt">What do you need written?</label>
    <textarea id="prompt" placeholder="Describe what you want written..."></textarea>
  </div>

  <button id="generate-btn">Generate Review</button>
  <div id="loading" hidden>
    <div id="progress-track"><div id="progress-fill"></div></div>
    <span class="loading-text">Generating&hellip;</span>
    <span id="progress-eta"></span>
  </div>
  <textarea id="output" readonly placeholder="Generated review will appear here..."></textarea>
  <div id="status-message"></div>
  <button id="export-pdf-btn" hidden>Export as PDF</button>
  <script src="lib/jspdf.umd.min.js"></script>
  <script src="lib/format.js"></script>
  <script src="generic_scrape.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
